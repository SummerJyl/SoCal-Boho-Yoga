<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoga Teacher Landing Page</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
  />
  <link rel="stylesheet" href="css/style.css" />
  <script src="./js/slider.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
  <script src="./js.js" defer></script> 
</head>

<body>
  <!-- Containers for partials -->
  <div id="nav"></div>
  <div id="hero"></div>
  <div id="benefits"></div>
  <div id="customize"></div>
  <div id="challenge-slider"></div>
  <div id="teacher-profiles"></div>
  <div id="courses"></div>
  <div id="empowerment"></div>
  <div id="footer"></div>

  <script>
    async function loadPartial(id, url) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('Failed to load ' + url);
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
      } catch (err) {
        console.error(err);
      }
    }

    async function loadAllPartials() {
      await Promise.all([
    loadPartial("nav", "./partials/nav.html"),
    loadPartial("hero", "./partials/hero.html"),
    loadPartial("benefits", "./partials/benefit.html"),
    loadPartial("customize", "./partials/customize.html"),
    loadPartial("challenge-slider", "./partials/challenge-slider.html"),
    loadPartial("teacher-profiles", "./partials/teacher-profiles.html"),
    loadPartial("courses", "./partials/course-slider.html"),
    loadPartial("empowerment", "./partials/empowerment.html"),
    loadPartial("footer", "./partials/footer.html"),
  ]);
}

    document.addEventListener("DOMContentLoaded", loadAllPartials);
  </script>

</body>
</html>
